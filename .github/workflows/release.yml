name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Self-check
        run: swift run Peep --check
      - name: Build
        run: scripts/build.sh "${GITHUB_REF_NAME#v}"
      - name: Publish
        run: gh release create "$GITHUB_REF_NAME" build/Peep.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
